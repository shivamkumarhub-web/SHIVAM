<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarkariAlert Ultra | Live Job Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #161d2f;
            --accent: #00d2ff;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #00ff88;
            --glass: rgba(22, 29, 47, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.6;
        }

        /* --- Sticky Navigation --- */
        .nav-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header { 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }

        .job-count-badge {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent);
        }

        /* --- Enhanced Search Bar --- */
        .search-wrap {
            padding: 10px 5% 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        #searchInput:focus {
            background: rgba(255,255,255,0.07);
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            color: var(--accent);
        }

        /* --- Source Indicators --- */
        .source-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .badge {
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 6px;
            background: #1e293b;
            color: var(--text-dim);
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .badge.ok { border-color: var(--success); color: var(--success); }
        .badge.loading { color: var(--accent); }

        /* --- The Unlimited Grid --- */
        .jobs-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 20px; 
            padding: 20px 5%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .card { 
            background: var(--surface); 
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: 0.3s;
        }

        .card:hover { 
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card h3 { 
            font-size: 1rem; 
            margin-bottom: 15px; 
            line-height: 1.4;
            color: #fff;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .source-tag { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; }
        .date-tag { font-size: 0.75rem; color: var(--text-dim); }

        .view-link {
            margin-top: 15px;
            display: block;
            text-align: center;
            padding: 10px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* --- Utility --- */
        #topBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            display: none;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .jobs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="nav-container">
    <header>
        <div class="logo">SARKARI<span>ALERT</span></div>
        <div id="jobCounter" class="job-count-badge">Syncing...</div>
    </header>

    <div class="search-wrap">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search across all government jobs..." onkeyup="renderJobs()">
        </div>
    </div>
</div>

<div id="source-status" class="source-bar"></div>

<main id="jobsContainer" class="jobs-grid"></main>

<button id="topBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fa-solid fa-arrow-up"></i>
</button>

<script>
const RSS2JSON = "https://api.rss2json.com/v1/api.json?rss_url=";
const SOURCES = [
    { name: "FreeJobAlert", url: "https://www.freejobalert.com/feed/" },
    { name: "SarkariJobFind", url: "https://www.sarkarijobfind.com/feed/" },
    { name: "RojgarResult", url: "https://www.rojgarresult.com/feed/" },
    { name: "SarkariExam", url: "https://www.sarkariexam.com/feed/" },
    { name: "SarkariResult", url: "https://www.sarkariresult.com/rssfeed.xml" }
];

let allJobs = [];

function setBadge(name, state) {
    const container = document.getElementById("source-status");
    let el = document.getElementById(`badge-${name}`);
    if (!el) {
        el = document.createElement("span");
        el.id = `badge-${name}`;
        container.appendChild(el);
    }
    el.className = "badge " + state;
    el.innerHTML = state === 'loading' ? `<i class="fa-solid fa-spinner fa-spin"></i> ${name}` : `<i class="fa-solid fa-check"></i> ${name}`;
}

async function fetchFeed(source) {
    setBadge(source.name, "loading");
    try {
        const res = await fetch(RSS2JSON + encodeURIComponent(source.url) + "&count=100");
        const data = await res.json();
        if (data.status !== "ok") throw "Err";
        setBadge(source.name, "ok");
        return data.items.map(item => ({
            title: item.title,
            source: source.name,
            date: item.pubDate,
            link: item.link
        }));
    } catch (e) {
        setBadge(source.name, "err");
        return [];
    }
}

function renderJobs() {
    const container = document.getElementById("jobsContainer");
    const query = document.getElementById("searchInput").value.toLowerCase();
    
    // Filter the full list based on search query
    const filtered = allJobs.filter(job => 
        job.title.toLowerCase().includes(query) || 
        job.source.toLowerCase().includes(query)
    );

    document.getElementById("jobCounter").textContent = `${filtered.length} Jobs Found`;

    container.innerHTML = filtered.map(job => `
        <div class="card">
            <h3>${job.title}</h3>
            <div class="card-meta">
                <span class="source-tag">${job.source}</span>
                <span class="date-tag">${job.date ? new Date(job.date).toLocaleDateString() : 'Active'}</span>
            </div>
            <a href="${job.link}" class="view-link" target="_blank">APPLY NOW</a>
        </div>
    `).join("");
}

async function loadJobs() {
    allJobs = [];
    const results = await Promise.all(SOURCES.map(fetchFeed));
    results.forEach(r => allJobs.push(...r));

    // Remove Duplicates by Link
    const seen = new Set();
    allJobs = allJobs.filter(j => seen.has(j.link) ? false : seen.add(j.link));
    
    // Sort by newest first
    allJobs.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    renderJobs();
}

// Show/Hide Top Button
window.onscroll = function() {
    const btn = document.getElementById("topBtn");
    btn.style.display = window.scrollY > 500 ? "block" : "none";
};

// Initial Load
loadJobs();
</script>

</body>
</html>
