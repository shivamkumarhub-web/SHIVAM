<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIVAM - Register & Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign Up Form -->
  <div class="container" id="signUp" style="display: none;">
    <h1 class="form-title">Register</h1>
    <form method="post" action="">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" name="fName" id="fName" placeholder="Enter first name" required>
        <label for="fName">First Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" name="lName" id="lName" placeholder="Enter Last name" required>
        <label for="lName">Last Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" id="signUpEmail" placeholder="Enter your Email..." required>
        <label for="signUpEmail">Enter Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" id="signUpPassword" placeholder="Enter Password" required>
        <label for="signUpPassword">Enter Password</label>
      </div>

      <input type="submit" class="btn" value="Sign Up" name="signUp">

      <p class="orWord">-------or-------</p>
      <div class="icons">
        <i class="fab fa-google"></i>
        <i class="fab fa-facebook"></i>
      </div>

      <div class="links">
        <p>Already Have Account?</p>
        <button type="button" id="signInButton">Sign In</button>
      </div>
    </form>
  </div>

  <!-- Sign In Form -->
  <div class="container" id="signIn">
    <h1 class="form-title">Sign In</h1>
    <form method="post" action="">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" id="signInEmail" placeholder="Enter your Email..." required>
        <label for="signInEmail">Enter Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" id="signInPassword" placeholder="Enter Password" required>
        <label for="signInPassword">Enter Password</label>
      </div>

      <p class="recover">
        <a href="#">Recover Password</a>
      </p>

      <input type="submit" class="btn" value="Sign In" name="signIn">

      <p class="orWord">-------or-------</p>
      <div class="icons">
        <i class="fab fa-google"></i>
        <i class="fab fa-facebook"></i>
      </div>

      <div class="links">
        <p>Don't Have Account Yet?</p>
        <button type="button" id="signUpButton">Sign Up</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
