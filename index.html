<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shivam Kumar | Full Stack Developer | AI Portfolio</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #1e1e2f;
    }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; display: block; }
    .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      z-index: 1000;
      padding: 0.8rem 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    /* Hero */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
    .hero-content h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem, 6vw, 4.8rem); font-weight: 800; margin-bottom: 1rem; }

    /* Skills Section */
    .skills-section { padding: 100px 0 80px; background: rgba(255,255,255,0.96); backdrop-filter: blur(4px); border-radius: 48px 48px 0 0; margin-top: 20px; }
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 900px; margin: 0 auto; }
    .skill-card { background: white; padding: 2rem; border-radius: 28px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

    /* Chat widget */
    #ai-chat-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
    #chat-toggle { width: 60px; height: 60px; border-radius: 30px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: white; font-size: 26px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    #chat-window { display: none; width: 360px; height: 520px; background: white; border-radius: 28px; position: absolute; bottom: 80px; right: 0; flex-direction: column; overflow: hidden; box-shadow: 0 20px 35px rgba(0,0,0,0.3); }
    .chat-header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 15px; color: white; font-weight: bold; display: flex; justify-content: space-between; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #f7f9fc; }
    .chat-message { padding: 10px 14px; border-radius: 20px; max-width: 85%; animation: fadeSlide 0.2s ease; font-size: 0.95rem; }
    .chat-message.user { background: linear-gradient(135deg, #667eea, #764ba2); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-message.ai { background: #e9ecef; color: #1e2a3a; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <header class="header">
    <nav class="nav">
      <div class="logo">⚡ Shivam Kumar</div>
    </nav>
  </header>

  <section class="hero" id="home">
    <div class="container">
      <div class="hero-content">
        <h1>Crafting Digital Excellence</h1>
        <p>Java Full Stack Developer | AI Enthusiast</p>
      </div>
    </div>
  </section>

  <div id="ai-chat-container">
    <button id="chat-toggle"><i class="fas fa-robot"></i></button>
    <div id="chat-window">
      <div class="chat-header">
        <span>🤖 Shivam AI Assistant</span>
        <i class="fas fa-times" id="close-chat" style="cursor:pointer;"></i>
      </div>
      <div id="chat-messages">
        <div class="chat-message ai">Hi! Ask me anything about Shivam's projects!</div>
      </div>
      <div style="display: flex; padding: 12px; gap: 8px; background: white; border-top: 1px solid #ddd;">
        <input type="text" id="user-input" placeholder="Ask me..." style="flex:1; padding: 10px; border-radius: 30px; border: 1px solid #ccc; outline: none;">
        <button id="send-btn" style="background: #667eea; border: none; border-radius: 30px; width: 44px; color: white;"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  
  <script type="module">
    import { askAI } from './gemini.js';

    // --- Background Logic ---
    const canvas = document.getElementById('bgCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 1.2;
    const particles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xc7d2fe, size: 0.008 }));
    const posArr = new Float32Array(1200 * 3);
    for(let i=0; i<3600; i++) posArr[i] = (Math.random() - 0.5) * 10;
    particles.geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    scene.add(particles);
    function animate() { requestAnimationFrame(animate); particles.rotation.y += 0.001; renderer.render(scene, camera); }
    animate();

    // --- CHAT UI LOGIC ---
    const chatWindow = document.getElementById('chat-window');
    const chatToggle = document.getElementById('chat-toggle');
    const closeChat = document.getElementById('close-chat');
    const chatMessagesDiv = document.getElementById('chat-messages');
    const userInputField = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // OPEN/CLOSE TOGGLE (FIXED)
    chatToggle.onclick = () => {
      chatWindow.style.display = (chatWindow.style.display === 'flex') ? 'none' : 'flex';
    };
    closeChat.onclick = () => {
      chatWindow.style.display = 'none';
    };

    const addMsg = (txt, isUser) => {
      const d = document.createElement('div');
      d.className = `chat-message ${isUser ? 'user' : 'ai'}`;
      d.innerText = txt;
      chatMessagesDiv.appendChild(d);
      chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
      return d;
    };

    sendBtn.onclick = async () => {
      const val = userInputField.value.trim();
      if(!val) return;

      addMsg(val, true);
      userInputField.value = '';

      const loadingBubble = addMsg("Thinking...", false);

      try {
        // Correctly calls your askAI export from gemini.js
        const reply = await askAI(val);
        loadingBubble.innerText = reply;
      } catch (e) {
        loadingBubble.innerText = "Error: Could not reach the AI. Check gemini.js.";
        console.error(e);
      }
    };

    userInputField.onkeypress = (e) => { if(e.key === "Enter") sendBtn.click(); };
  </script>
</body>
</html>
