<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shivam Kumar | AI Portfolio</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #0c0c1a; color: white; overflow-x: hidden; }
    canvas { position: fixed; top: 0; left: 0; z-index: -1; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* Header */
    .header { position: fixed; top: 0; width: 100%; padding: 20px 0; background: rgba(12, 12, 26, 0.8); backdrop-filter: blur(10px); z-index: 1000; }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Hero */
    .hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 20px; }
    .btn { padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s; display: inline-block; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }

    /* Skills Grid */
    .skills-section { padding: 100px 0; background: white; color: #1a1a2e; border-radius: 50px 50px 0 0; }
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 50px; }
    .skill-card { padding: 40px; background: #f8f9ff; border-radius: 30px; text-align: center; transition: 0.3s; }
    .skill-card:hover { transform: translateY(-10px); }
    .skill-card i { font-size: 3rem; color: #667eea; margin-bottom: 20px; }

    /* Chat Widget */
    #ai-chat-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
    #chat-toggle { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: white; font-size: 28px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #chat-window { display: none; width: 350px; height: 500px; background: white; border-radius: 25px; position: absolute; bottom: 80px; right: 0; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #eee; }
    .chat-header { background: #667eea; padding: 15px; color: white; font-weight: bold; display: flex; justify-content: space-between; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fcfcfc; }
    .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 0.9rem; line-height: 1.4; color: #333; }
    .msg.user { background: #667eea; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background: #eef1f6; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-input-area { display: flex; padding: 10px; gap: 8px; border-top: 1px solid #eee; background: white; }
    #user-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
    #send-btn { background: #667eea; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <header class="header">
    <div class="container nav">
      <div class="logo">⚡ SHIVAM</div>
      <a href="#contact" class="btn btn-primary" style="padding: 8px 20px;">Contact</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Digital Excellence.</h1>
      <p style="font-size: 1.2rem; margin-bottom: 30px; opacity: 0.8;">Advanced Java Full Stack Developer & AI Enthusiast</p>
      <a href="#skills" class="btn btn-primary">View Stack</a>
    </div>
  </section>

  <section class="skills-section" id="skills">
    <div class="container">
      <h2 style="text-align: center; font-family: 'Syne'; font-size: 2.5rem;">Expertise</h2>
      <div class="skills-grid">
        <div class="skill-card"><i class="fab fa-java"></i><h3>Java / Spring</h3></div>
        <div class="skill-card"><i class="fab fa-react"></i><h3>React / Next</h3></div>
        <div class="skill-card"><i class="fab fa-google"></i><h3>Firebase</h3></div>
      </div>
    </div>
  </section>

  <div id="ai-chat-container">
    <button id="chat-toggle"><i class="fas fa-robot"></i></button>
    <div id="chat-window">
      <div class="chat-header"><span>Assistant</span><i class="fas fa-times" id="close-chat" style="cursor:pointer;"></i></div>
      <div id="chat-messages"><div class="msg ai">Hi! Ask me about Shivam's work.</div></div>
      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type here...">
        <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script type="module">
    import { askAI } from './gemini.js';

    // Toggle Chat
    const chatWindow = document.getElementById('chat-window');
    document.getElementById('chat-toggle').onclick = () => chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
    document.getElementById('close-chat').onclick = () => chatWindow.style.display = 'none';

    // Send Logic
    const messages = document.getElementById('chat-messages');
    const input = document.getElementById('user-input');
    const send = document.getElementById('send-btn');

    const addMsg = (text, type) => {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    };

    send.onclick = async () => {
      const val = input.value.trim();
      if(!val) return;
      addMsg(val, 'user');
      input.value = '';
      const loading = addMsg('...', 'ai');
      const response = await askAI(val);
      loading.innerText = response;
    };

    input.onkeypress = (e) => { if(e.key === "Enter") send.click(); };

    // Background Canvas
    const canvas = document.getElementById('bgCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 1.5;
    const geometry = new THREE.BufferGeometry();
    const vertices = [];
    for(let i=0; i<2000; i++) vertices.push((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    const stars = new THREE.Points(geometry, new THREE.PointsMaterial({color: 0x667eea, size: 0.01}));
    scene.add(stars);
    function animate() { requestAnimationFrame(animate); stars.rotation.y += 0.001; renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
