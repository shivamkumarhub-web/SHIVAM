<script>
const SOURCES = [
    { name: "FreeJobAlert", url: "https://www.freejobalert.com/feed/" },
    { name: "SarkariJobFind", url: "https://www.sarkarijobfind.com/feed/" },
    { name: "RojgarResult", url: "https://www.rojgarresult.com/feed/" },
    { name: "SarkariExam", url: "https://www.sarkariexam.com/feed/" },
    { name: "SarkariResult", url: "https://www.sarkariresult.com/rssfeed.xml" },
    { name: "Adda247 Jobs", url: "https://www.adda247.com/jobs/feed/" }
];

let allJobs = [];
let filteredJobs = [];
let visibleCount = 50;

const PROXIES = [
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`
];

function setBadge(name, state) {
    const container = document.getElementById("source-status");
    let el = document.getElementById(`badge-${name}`);
    if (!el) {
        el = document.createElement("span");
        el.id = `badge-${name}`;
        container.appendChild(el);
    }
    el.className = "badge " + state;
    el.innerHTML = `${name} (${state})`;
}

function parseRSS(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, "text/xml");
    const items = [...xml.querySelectorAll("item")];

    return items.map(item => ({
        title: item.querySelector("title")?.textContent || "No Title",
        link: item.querySelector("link")?.textContent || "#",
        date: item.querySelector("pubDate")?.textContent ||
              item.querySelector("published")?.textContent ||
              new Date().toISOString()
    }));
}

async function fetchFeed(source) {
    setBadge(source.name, "loading");

    for (let proxy of PROXIES) {
        try {
            const res = await fetch(proxy(source.url));
            const text = await res.text();

            let xmlContent;

            try {
                const json = JSON.parse(text);
                xmlContent = json.contents || text;
            } catch {
                xmlContent = text;
            }

            const jobs = parseRSS(xmlContent);

            setBadge(source.name, "ok");

            return jobs.map(job => ({
                ...job,
                source: source.name,
                priority: getPriority(job.title)
            }));

        } catch (err) {
            console.log("Retrying proxy...");
        }
    }

    setBadge(source.name, "err");
    return [];
}

// 🧠 AI-like priority ranking
function getPriority(title) {
    title = title.toLowerCase();

    if (title.includes("apply") || title.includes("online form")) return 3;
    if (title.includes("admit card") || title.includes("result")) return 2;
    return 1;
}

// 🔍 Search filter
function filterJobs() {
    const q = document.getElementById("searchInput").value.toLowerCase();

    filteredJobs = allJobs.filter(j =>
        j.title.toLowerCase().includes(q) ||
        j.source.toLowerCase().includes(q)
    );

    visibleCount = 50;
    renderJobs();
}

// 🎨 Render jobs
function renderJobs() {
    const container = document.getElementById("jobs");

    const list = filteredJobs.slice(0, visibleCount);

    if (!list.length) {
        container.innerHTML = "<h2 style='text-align:center'>No jobs found</h2>";
        return;
    }

    container.innerHTML = list.map(job => `
        <div class="job-card">
            <h3>${job.title}</h3>

            <div class="info-item">${job.source}</div>
            <div class="info-item">${new Date(job.date).toLocaleDateString()}</div>

            <a href="${job.link}" target="_blank" class="btn-view">View Job</a>
        </div>
    `).join("");
}

// 🚀 Load jobs
async function loadJobs() {
    document.getElementById("status").innerText = "Fetching jobs...";

    const results = await Promise.all(SOURCES.map(fetchFeed));

    allJobs = results.flat();

    // ✅ Proper duplicate removal
    const map = new Map();
    allJobs.forEach(j => map.set(j.link, j));
    allJobs = Array.from(map.values());

    // ✅ Sort by priority + date
    allJobs.sort((a, b) => {
        if (b.priority !== a.priority) return b.priority - a.priority;
        return new Date(b.date) - new Date(a.date);
    });

    filteredJobs = [...allJobs];

    document.getElementById("status").innerText =
        `Loaded ${allJobs.length} jobs`;

    renderJobs();
}

// 📜 Infinite scroll
window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        visibleCount += 20;
        renderJobs();
    }
});

loadJobs();
</script>
